<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Combo Clip Composer Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header / Toolbar */
    .toolbar {
      height: 40px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    .toolbar h1 {
      font-size: 14px;
      font-weight: 500;
      color: #cccccc;
    }

    /* Main content area */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left panel - Properties */
    .panel-left {
      width: 280px;
      background-color: #252526;
      border-right: 1px solid #3d3d3d;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      height: 32px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #888888;
    }

    .panel-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    /* Center - Video preview */
    .video-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d0d0d;
      position: relative;
    }

    .preview-placeholder {
      text-align: center;
      color: #666666;
    }

    .preview-placeholder h2 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .preview-placeholder p {
      font-size: 13px;
      color: #555555;
    }

    /* Right panel - Layers/Elements */
    .panel-right {
      width: 280px;
      background-color: #252526;
      border-left: 1px solid #3d3d3d;
      display: flex;
      flex-direction: column;
    }

    /* Timeline at bottom */
    .timeline {
      height: 150px;
      background-color: #252526;
      border-top: 1px solid #3d3d3d;
      display: flex;
      flex-direction: column;
    }

    .timeline-controls {
      height: 36px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .timeline-tracks {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .timeline-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 13px;
    }

    /* Button styles */
    .btn {
      padding: 4px 12px;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      background-color: #0e639c;
      color: #ffffff;
    }

    .btn:hover {
      background-color: #1177bb;
    }

    .btn:disabled {
      background-color: #3d3d3d;
      color: #666666;
      cursor: not-allowed;
    }

    .btn-open {
      margin-left: auto;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #007acc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      color: #cccccc;
      font-size: 14px;
    }

    .loading-subtext {
      margin-top: 8px;
      color: #888888;
      font-size: 12px;
    }

    /* Status bar */
    .status-bar {
      height: 22px;
      background-color: #007acc;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
    }

    .status-item {
      margin-right: 16px;
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <h1>Combo Clip Composer Editor</h1>
    <button class="btn btn-open" id="openVideoBtn">Open Video</button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Left Panel - Properties -->
    <div class="panel-left">
      <div class="panel-header">Properties</div>
      <div class="panel-content">
        <p style="color: #666666; font-size: 13px;">Load a video to see properties</p>
      </div>
    </div>

    <!-- Center - Video Preview -->
    <div class="video-preview">
      <div class="preview-container" id="previewContainer">
        <div class="preview-placeholder" id="previewPlaceholder">
          <h2>No Video Loaded</h2>
          <p>Open a video file to begin editing</p>
        </div>
        <!-- Loading overlay -->
        <div class="loading-overlay hidden" id="loadingOverlay">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading Video</div>
          <div class="loading-subtext" id="loadingSubtext">Extracting frames...</div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Layers -->
    <div class="panel-right">
      <div class="panel-header">Layers</div>
      <div class="panel-content">
        <p style="color: #666666; font-size: 13px;">No layers yet</p>
      </div>
    </div>
  </div>

  <!-- Timeline -->
  <div class="timeline">
    <div class="timeline-controls">
      <button class="btn" disabled>⏮</button>
      <button class="btn" disabled>◀</button>
      <button class="btn" disabled>▶</button>
      <button class="btn" disabled>⏭</button>
      <span style="color: #888888; font-size: 12px; margin-left: 8px;">00:00:00 / 00:00:00</span>
    </div>
    <div class="timeline-tracks">
      <div class="timeline-placeholder">
        Load a video to see the timeline
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-item">Ready</span>
    <span class="status-item">No video loaded</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const path = require('path');

    // Editor state
    const editorState = {
      videoPath: null,
      framesDir: null,
      framePaths: [],
      frameCount: 0,
      currentFrame: 0,
      metadata: null,
      isLoading: false
    };

    // DOM elements
    const openVideoBtn = document.getElementById('openVideoBtn');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingSubtext = document.getElementById('loadingSubtext');
    const statusBar = document.querySelector('.status-bar');

    /**
     * Updates the status bar with current state
     */
    function updateStatusBar() {
      const items = statusBar.querySelectorAll('.status-item');
      if (editorState.isLoading) {
        items[0].textContent = 'Loading...';
        items[1].textContent = 'Extracting frames';
      } else if (editorState.videoPath) {
        items[0].textContent = 'Ready';
        const filename = path.basename(editorState.videoPath);
        items[1].textContent = `${filename} - ${editorState.frameCount} frames`;
      } else {
        items[0].textContent = 'Ready';
        items[1].textContent = 'No video loaded';
      }
    }

    /**
     * Shows the loading indicator
     */
    function showLoading(message = 'Extracting frames...') {
      editorState.isLoading = true;
      loadingOverlay.classList.remove('hidden');
      loadingSubtext.textContent = message;
      openVideoBtn.disabled = true;
      updateStatusBar();
    }

    /**
     * Hides the loading indicator
     */
    function hideLoading() {
      editorState.isLoading = false;
      loadingOverlay.classList.add('hidden');
      openVideoBtn.disabled = false;
      updateStatusBar();
    }

    /**
     * Updates editor state with loaded video data
     */
    function onVideoLoaded(data) {
      editorState.videoPath = data.videoPath;
      editorState.framesDir = data.framesDir;
      editorState.framePaths = data.framePaths;
      editorState.frameCount = data.frameCount;
      editorState.metadata = data.metadata;
      editorState.currentFrame = 0;

      hideLoading();

      // Update placeholder text to show video info
      const placeholder = previewPlaceholder;
      placeholder.innerHTML = `
        <h2>Video Loaded</h2>
        <p>${path.basename(data.videoPath)}</p>
        <p style="margin-top: 8px; font-size: 12px; color: #666666;">
          ${data.metadata.width}x${data.metadata.height} |
          ${data.metadata.fps.toFixed(2)} fps |
          ${data.frameCount} frames |
          ${data.metadata.duration.toFixed(2)}s
        </p>
      `;

      // Update timeline time display
      const timeDisplay = document.querySelector('.timeline-controls span');
      if (timeDisplay) {
        const totalSeconds = data.metadata.duration;
        const formatTime = (s) => {
          const mins = Math.floor(s / 60);
          const secs = Math.floor(s % 60);
          const frames = Math.floor((s % 1) * data.metadata.fps);
          return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}:${frames.toString().padStart(2, '0')}`;
        };
        timeDisplay.textContent = `00:00:00 / ${formatTime(totalSeconds)}`;
      }

      console.log('Video loaded:', editorState);
    }

    /**
     * Handles video loading error
     */
    function onVideoLoadError(error) {
      hideLoading();
      console.error('Failed to load video:', error);
      alert(`Failed to load video: ${error}`);
    }

    /**
     * Opens video file via IPC
     */
    async function openVideo() {
      showLoading('Opening file dialog...');

      try {
        const result = await ipcRenderer.invoke('open-video');

        if (result.canceled) {
          hideLoading();
          return;
        }

        if (result.success) {
          onVideoLoaded(result);
        } else if (result.error) {
          onVideoLoadError(result.error);
        }
      } catch (error) {
        onVideoLoadError(error.message);
      }
    }

    // Event listeners
    openVideoBtn.addEventListener('click', openVideo);

    // IPC event listeners
    ipcRenderer.on('video-loading-started', (event, data) => {
      showLoading(`Loading: ${path.basename(data.videoPath)}`);
    });

    ipcRenderer.on('video-loaded', (event, data) => {
      onVideoLoaded(data);
    });

    ipcRenderer.on('video-load-error', (event, data) => {
      onVideoLoadError(data.error);
    });

    // Initialize
    console.log('Combo Clip Composer Editor initialized');
    updateStatusBar();
  </script>
</body>
</html>
