<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Combo Clip Composer Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header / Toolbar */
    .toolbar {
      height: 40px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    .toolbar h1 {
      font-size: 14px;
      font-weight: 500;
      color: #cccccc;
    }

    /* Main content area */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left panel - Properties */
    .panel-left {
      width: 280px;
      background-color: #252526;
      border-right: 1px solid #3d3d3d;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      height: 32px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #888888;
    }

    .panel-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    /* Center - Video preview */
    .video-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d0d0d;
      position: relative;
    }

    .preview-placeholder {
      text-align: center;
      color: #666666;
    }

    .preview-placeholder h2 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .preview-placeholder p {
      font-size: 13px;
      color: #555555;
    }

    /* Right panel - Layers/Elements */
    .panel-right {
      width: 280px;
      background-color: #252526;
      border-left: 1px solid #3d3d3d;
      display: flex;
      flex-direction: column;
    }

    /* Timeline at bottom */
    .timeline {
      height: 150px;
      background-color: #252526;
      border-top: 1px solid #3d3d3d;
      display: flex;
      flex-direction: column;
    }

    .timeline-controls {
      height: 36px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .timeline-tracks {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .timeline-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 13px;
    }

    /* Button styles */
    .btn {
      padding: 4px 12px;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      background-color: #0e639c;
      color: #ffffff;
    }

    .btn:hover {
      background-color: #1177bb;
    }

    .btn:disabled {
      background-color: #3d3d3d;
      color: #666666;
      cursor: not-allowed;
    }

    /* Status bar */
    .status-bar {
      height: 22px;
      background-color: #007acc;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
    }

    .status-item {
      margin-right: 16px;
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <h1>Combo Clip Composer Editor</h1>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Left Panel - Properties -->
    <div class="panel-left">
      <div class="panel-header">Properties</div>
      <div class="panel-content">
        <p style="color: #666666; font-size: 13px;">Load a video to see properties</p>
      </div>
    </div>

    <!-- Center - Video Preview -->
    <div class="video-preview">
      <div class="preview-container">
        <div class="preview-placeholder">
          <h2>No Video Loaded</h2>
          <p>Open a video file to begin editing</p>
        </div>
      </div>
    </div>

    <!-- Right Panel - Layers -->
    <div class="panel-right">
      <div class="panel-header">Layers</div>
      <div class="panel-content">
        <p style="color: #666666; font-size: 13px;">No layers yet</p>
      </div>
    </div>
  </div>

  <!-- Timeline -->
  <div class="timeline">
    <div class="timeline-controls">
      <button class="btn" disabled>⏮</button>
      <button class="btn" disabled>◀</button>
      <button class="btn" disabled>▶</button>
      <button class="btn" disabled>⏭</button>
      <span style="color: #888888; font-size: 12px; margin-left: 8px;">00:00:00 / 00:00:00</span>
    </div>
    <div class="timeline-tracks">
      <div class="timeline-placeholder">
        Load a video to see the timeline
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-item">Ready</span>
    <span class="status-item">No video loaded</span>
  </div>

  <script>
    // Placeholder script - will be expanded in future user stories
    console.log('Combo Clip Composer Editor initialized');
  </script>
</body>
</html>
